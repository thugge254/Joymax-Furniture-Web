<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Joymax Furniture & Metal Work</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Main Login Card */
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 40px 35px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .login-card h2 {
      font-size: 2rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 24px;
    }

    /* Dynamic Alert Message Styling */
    .alert-message {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 18px;
      display: none;
      text-align: left;
    }

    .alert-message.error {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-message.success {
      background-color: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input::placeholder {
      color: #9ca3af;
    }

    .form-group input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: #F59E0B;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s ease;
    }

    .btn-login:hover {
      background-color: #d97706;
    }

    .reset-text {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #9ca3af;
    }

    .reset-link {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }

    .reset-link:hover {
      text-decoration: underline;
    }

    /* Modal Background Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    /* Reset Password Modal Window */
    .reset-modal {
      background: #ffffff;
      width: 90%;
      max-width: 400px;
      padding: 32px 28px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      text-align: center;
      transform: scale(0.95);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .reset-modal {
      transform: scale(1);
    }

    .reset-modal h3 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 20px;
    }

    /* Button Styling Inside Modal */
    .btn-send-code {
      width: 100%;
      padding: 12px;
      background-color: #f59e0b;
      color: #111827;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background-color 0.2s ease;
    }

    .btn-send-code:hover {
      background-color: #d97706;
    }

    .btn-cancel {
      width: 100%;
      padding: 12px;
      background-color: #f3f4f6;
      color: #374151;
      font-size: 0.95rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-cancel:hover {
      background-color: #e5e7eb;
    }
  </style>
</head>
<body>

  <!-- Main Login Window -->
  <div class="login-card">
    <h2>Login</h2>
    
    <!-- Status Alert Container -->
    <div id="loginAlert" class="alert-message"></div>

    <form id="loginForm">
      <div class="form-group">
        <input type="email" id="loginEmail" name="email" placeholder="Email" required>
      </div>
      <div class="form-group">
        <input type="password" id="loginPassword" name="password" placeholder="Password" required>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">Login</button>
    </form>

    <p class="reset-text">
      Forgot password? <span class="reset-link" id="openResetModal">Reset</span>
    </p>
  </div>

  <!-- Reset Password Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="reset-modal">
      <h3>Reset Password</h3>
      
      <div id="resetAlert" class="alert-message"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="resetEmail">Email</label>
          <input type="email" id="resetEmail" placeholder="Enter your email" required>
        </div>

        <button type="submit" class="btn-send-code">Send Code</button>
        <button type="button" class="btn-cancel" id="closeResetModal">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Interactive JavaScript -->
  <script>
    const openResetModal = document.getElementById('openResetModal');
    const closeResetModal = document.getElementById('closeResetModal');
    const modalOverlay = document.getElementById('modalOverlay');
    const loginForm = document.getElementById('loginForm');
    const resetForm = document.getElementById('resetForm');
    const loginAlert = document.getElementById('loginAlert');
    const resetAlert = document.getElementById('resetAlert');

    // Helper to display alert banner inside forms
    function showAlert(element, message, type) {
      element.textContent = message;
      element.className = `alert-message ${type}`;
      element.style.display = 'block';
    }

    // Modal Control
    openResetModal.addEventListener('click', () => {
      modalOverlay.classList.add('active');
    });

    closeResetModal.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      resetAlert.style.display = 'none';
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
        resetAlert.style.display = 'none';
      }
    });

    // Handle Login API Request
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginAlert.style.display = 'none';

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const loginBtn = document.getElementById('loginBtn');

      try {
        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in...';

        const response = await fetch('http://localhost:5050/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert(loginAlert, 'Login successful! Redirecting...', 'success');
          
          // Save user credentials/session in browser memory
          localStorage.setItem('joymax_user', JSON.stringify(data.user));

          // Redirect to homepage after brief delay
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1200);
        } else {
          showAlert(loginAlert, data.message || 'Invalid email or password.', 'error');
        }
      } catch (err) {
        console.error('Login Error:', err);
        showAlert(loginAlert, 'Unable to connect to server. Ensure server.js is running.', 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });

    // Handle Password Reset Request
    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      resetAlert.style.display = 'none';

      const email = document.getElementById('resetEmail').value;

      try {
        const response = await fetch('http://localhost:5050/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert(resetAlert, 'Reset link sent! Please check your inbox.', 'success');
        } else {
          showAlert(resetAlert, data.message || 'Failed to request reset.', 'error');
        }
      } catch (err) {
        showAlert(resetAlert, 'Server error. Please try again later.', 'error');
      }
    });
  </script>

</body>
</html>
